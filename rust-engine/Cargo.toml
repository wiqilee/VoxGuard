[package]
name        = "scam-shield-audio"
version     = "1.0.0"
authors     = ["Wiqi Lee <wiqi@scamshield.dev>"]
edition     = "2021"
description = "Real-time audio preprocessing engine for Scam Shield — compiled to WebAssembly"
license     = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen    = "0.2"
js-sys          = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "AudioContext",
    "AudioNode",
    "MediaStream",
    "MediaStreamConstraints",
] }
serde            = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
# Optimize for size — critical for WASM bundle performance
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
