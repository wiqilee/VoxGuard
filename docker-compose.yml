version: "3.9"

# ── Scam Shield — Local Development Stack ─────────────────────
# Usage: docker-compose up
# Starts backend (FastAPI) + frontend (Vite) together.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - BACKEND_CORS_ORIGINS=http://localhost:5173
      - DEBUG=true
    volumes:
      - ./backend/app:/app/app   # Hot reload in dev
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent overwriting container node_modules
    environment:
      - VITE_WS_URL=ws://localhost:8000/ws/session
      - VITE_DEMO_MODE=false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  node_modules:
