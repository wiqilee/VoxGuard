name: VoxGuard Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-gcp:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project
        run: gcloud config set project voxguard-489803

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy voxguard-backend \
            --project voxguard-489803 \
            --source backend/ \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},GOOGLE_CLOUD_PROJECT=voxguard-489803,GEMINI_MODEL=gemini-2.5-flash-native-audio,GEMINI_VISION_MODEL=gemini-2.5-flash" \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 5 \
            --session-affinity