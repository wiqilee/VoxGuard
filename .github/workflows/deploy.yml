# VoxGuard — CI/CD Pipeline
# Rename: ci.yml → deploy.yml (or keep both, doesn't matter — GitHub reads all files in .github/workflows/)
# 
# ⚠️  GCP_SA_KEY warning: severity 4 = VS Code linter warning only, NOT a real error.
#     Fix: add the secret in GitHub → Settings → Secrets and variables → Actions → New repository secret
#     Name: GCP_SA_KEY   Value: (paste your GCP service account JSON key)

name: VoxGuard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Rust WASM Build (MUST run first) ─────────────────────────
  rust-wasm-build:
    name: Rust WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: rust-engine
        run: wasm-pack build --target web --out-dir ../frontend/src/wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-output
          path: frontend/src/wasm/
          retention-days: 1

  # ── 2. Frontend Build (depends on WASM) ─────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: rust-wasm-build          # ← critical: wait for WASM first
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-output
          path: frontend/src/wasm/

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. Backend Tests ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}   # optional for test env

  # ── 4. Deploy to GCP (main branch only) ─────────────────────────
  deploy-gcp:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # ↑ GCP_SA_KEY warning in VS Code = secret not yet added to repo
          # Fix: GitHub repo → Settings → Secrets → New secret → Name: GCP_SA_KEY

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy voxguard-backend \
            --source backend/ \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10
