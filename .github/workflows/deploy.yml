name: VoxGuard Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-gcp:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Run API
        run: gcloud services enable run.googleapis.com --project=voxguard-prod || true

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy voxguard-489803 \
            --source backend/ \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --set-env-vars GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10
