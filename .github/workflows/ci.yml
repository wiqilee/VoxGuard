name: VoxGuard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-wasm-build:
    name: Rust WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [FIX] Replace dtolnay/rust-toolchain with direct rustup commands
      # dtolnay/rust-toolchain@stable fails with 401 Unauthorized when
      # GitHub API rate-limits the tarball download for the action repo.
      # Using rustup directly is more reliable and doesn't depend on
      # third-party action downloads.
      - name: Install Rust + wasm32 target
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: rust-engine
        run: wasm-pack build --target web --out-dir ../frontend/src/wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-output
          path: frontend/src/wasm/
          retention-days: 1

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: rust-wasm-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-output
          path: frontend/src/wasm/

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          GOOGLE_API_KEY: "test-key-ci"
          ENVIRONMENT: "test"