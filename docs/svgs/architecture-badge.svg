<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .label { font-family: 'Courier New', monospace; font-size: 9px; fill: rgba(255,255,255,0.6); }
      .title { font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; }
      @keyframes pulse1 { 0%,100%{opacity:1} 50%{opacity:0.3} }
      @keyframes pulse2 { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes flow { 0%{stroke-dashoffset:20} 100%{stroke-dashoffset:0} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 3px currentColor)} 50%{filter:drop-shadow(0 0 10px currentColor)} }
    </style>
    <filter id="glow-cyan"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-red"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="120" fill="#020408"/>
  <!-- Grid lines -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="119" x2="800" y2="119" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>

  <!-- Node: CALLER -->
  <rect x="20" y="30" width="100" height="60" rx="2" fill="none" stroke="#ff2d55" stroke-width="1.5"/>
  <rect x="20" y="30" width="100" height="60" rx="2" fill="#ff2d55" fill-opacity="0.08"/>
  <text x="70" y="52" text-anchor="middle" class="title" fill="#ff2d55" font-size="9">📞 CALLER</text>
  <text x="70" y="66" text-anchor="middle" class="label">Scam Voice/Video</text>
  <text x="70" y="78" text-anchor="middle" class="label">ADVERSARY</text>
  <!-- Pulse dot -->
  <circle cx="110" cy="36" r="4" fill="#ff2d55"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>

  <!-- Arrow 1 -->
  <line x1="120" y1="60" x2="155" y2="60" stroke="#ff2d55" stroke-width="1.5" stroke-dasharray="4,2"><animate attributeName="stroke-dashoffset" from="6" to="0" dur="0.5s" repeatCount="indefinite"/></line>
  <polygon points="155,56 163,60 155,64" fill="#ff2d55"/>

  <!-- Node: RUST WASM -->
  <rect x="163" y="30" width="110" height="60" rx="2" fill="none" stroke="#ff9500" stroke-width="1.5"/>
  <rect x="163" y="30" width="110" height="60" rx="2" fill="#ff9500" fill-opacity="0.08"/>
  <text x="218" y="52" text-anchor="middle" class="title" fill="#ff9500" font-size="9">🦀 RUST WASM</text>
  <text x="218" y="65" text-anchor="middle" class="label">Spectral Analysis</text>
  <text x="218" y="77" text-anchor="middle" class="label">&lt;100ms latency</text>
  <circle cx="263" cy="36" r="4" fill="#ff9500"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></circle>

  <!-- Arrow 2 -->
  <line x1="273" y1="60" x2="308" y2="60" stroke="#ff9500" stroke-width="1.5" stroke-dasharray="4,2"><animate attributeName="stroke-dashoffset" from="6" to="0" dur="0.5s" repeatCount="indefinite"/></line>
  <polygon points="308,56 316,60 308,64" fill="#ff9500"/>

  <!-- Node: GEMINI LIVE -->
  <rect x="316" y="20" width="120" height="80" rx="2" fill="none" stroke="#4285F4" stroke-width="2"/>
  <rect x="316" y="20" width="120" height="80" rx="2" fill="#4285F4" fill-opacity="0.1"/>
  <text x="376" y="45" text-anchor="middle" class="title" fill="#4285F4" font-size="9">✦ GEMINI</text>
  <text x="376" y="58" text-anchor="middle" class="title" fill="#4285F4" font-size="9">LIVE API</text>
  <text x="376" y="72" text-anchor="middle" class="label">Real-time Analysis</text>
  <text x="376" y="84" text-anchor="middle" class="label">50+ Patterns</text>
  <!-- Animated ring -->
  <circle cx="376" cy="60" r="44" fill="none" stroke="#4285F4" stroke-width="0.5" opacity="0.3"><animate attributeName="r" values="38;45;38" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/></circle>

  <!-- Arrow 3 -->
  <line x1="436" y1="60" x2="471" y2="60" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="4,2"><animate attributeName="stroke-dashoffset" from="6" to="0" dur="0.5s" repeatCount="indefinite"/></line>
  <polygon points="471,56 479,60 471,64" fill="#4285F4"/>

  <!-- Node: THREAT ENGINE -->
  <rect x="479" y="30" width="110" height="60" rx="2" fill="none" stroke="#7b61ff" stroke-width="1.5"/>
  <rect x="479" y="30" width="110" height="60" rx="2" fill="#7b61ff" fill-opacity="0.08"/>
  <text x="534" y="52" text-anchor="middle" class="title" fill="#7b61ff" font-size="9">⚡ THREAT</text>
  <text x="534" y="64" text-anchor="middle" class="title" fill="#7b61ff" font-size="9">ENGINE</text>
  <text x="534" y="78" text-anchor="middle" class="label">Score 0-100</text>

  <!-- Arrow 4 -->
  <line x1="589" y1="60" x2="624" y2="60" stroke="#30d158" stroke-width="1.5" stroke-dasharray="4,2"><animate attributeName="stroke-dashoffset" from="6" to="0" dur="0.5s" repeatCount="indefinite"/></line>
  <polygon points="624,56 632,60 624,64" fill="#30d158"/>

  <!-- Node: USER ALERT -->
  <rect x="632" y="30" width="110" height="60" rx="2" fill="none" stroke="#30d158" stroke-width="1.5"/>
  <rect x="632" y="30" width="110" height="60" rx="2" fill="#30d158" fill-opacity="0.08"/>
  <text x="687" y="52" text-anchor="middle" class="title" fill="#30d158" font-size="9">🛡 ALERT</text>
  <text x="687" y="65" text-anchor="middle" class="label">Real-time warning</text>
  <text x="687" y="77" text-anchor="middle" class="label">to user</text>
  <circle cx="732" cy="36" r="4" fill="#30d158"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></circle>

  <!-- Bottom label -->
  <text x="400" y="112" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="rgba(0,212,255,0.5)">VOXGUARD — REAL-TIME MULTIMODAL SCAM DETECTION — GEMINI LIVE AGENT CHALLENGE 2026</text>
</svg>
