<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <defs>
    <style>
      @keyframes pulse1{0%,100%{opacity:.6}50%{opacity:1}}
      @keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #00d4ff)}50%{filter:drop-shadow(0 0 8px #00d4ff)}}
      .bg{fill:#020408}.lbl{font-family:'Courier New',monospace;font-size:7px;letter-spacing:1px}
    </style>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#00d4ff" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="800" height="120" class="bg"/>
  <rect x=".5" y=".5" width="799" height="119" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".3"/>
  <text x="400" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#00d4ff" letter-spacing="2" font-weight="bold" style="animation:glow 3s ease infinite">VOXGUARD SYSTEM ARCHITECTURE</text>
  <text x="400" y="35" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="rgba(255,255,255,.5)" letter-spacing="1">REAL-TIME MULTIMODAL SCAM DETECTION PIPELINE</text>
  <rect x="20" y="50" width="90" height="40" rx="2" fill="#ff2d5518" stroke="#ff2d55" stroke-width="1"/>
  <text x="65" y="66" text-anchor="middle" class="lbl" fill="#ff2d55">AUDIO INPUT</text>
  <text x="65" y="78" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.4)">16kHz PCM</text>
  <rect x="140" y="50" width="100" height="40" rx="2" fill="#ff950018" stroke="#ff9500" stroke-width="1"/>
  <text x="190" y="66" text-anchor="middle" class="lbl" fill="#ff9500">RUST WASM</text>
  <text x="190" y="78" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.4)">Wiener NR</text>
  <path d="M112,70 L138,70" fill="none" stroke="#ff2d55" stroke-width="1.5" marker-end="url(#ah)" style="animation:pulse1 2s ease infinite"/>
  <rect x="270" y="50" width="90" height="40" rx="2" fill="#00d4ff18" stroke="#00d4ff" stroke-width="1"/>
  <text x="315" y="66" text-anchor="middle" class="lbl" fill="#00d4ff">WEBSOCKET</text>
  <text x="315" y="78" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.4)">250ms frames</text>
  <path d="M242,70 L268,70" fill="none" stroke="#ff9500" stroke-width="1.5" marker-end="url(#ah)" style="animation:pulse1 2s ease .3s infinite"/>
  <rect x="390" y="50" width="110" height="40" rx="2" fill="#4285F418" stroke="#4285F4" stroke-width="1"/>
  <text x="445" y="66" text-anchor="middle" class="lbl" fill="#4285F4">GEMINI LIVE</text>
  <text x="445" y="78" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.4)">2.0-flash-live</text>
  <circle cx="502" cy="55" r="3" fill="#4285F4"><animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/></circle>
  <path d="M362,70 L388,70" fill="none" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#ah)" style="animation:pulse1 2s ease .5s infinite"/>
  <rect x="530" y="50" width="110" height="40" rx="2" fill="#7b61ff18" stroke="#7b61ff" stroke-width="1"/>
  <text x="585" y="66" text-anchor="middle" class="lbl" fill="#7b61ff">THREAT ENGINE</text>
  <text x="585" y="78" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.4)">Score 0-100</text>
  <path d="M502,70 L528,70" fill="none" stroke="#4285F4" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="670" y="50" width="110" height="40" rx="2" fill="#30d15818" stroke="#30d158" stroke-width="1"/>
  <text x="725" y="66" text-anchor="middle" class="lbl" fill="#30d158">ALERT</text>
  <text x="725" y="78" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.4)">&lt;80ms latency</text>
  <path d="M642,70 L668,70" fill="none" stroke="#7b61ff" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="65" y="108" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.25)">BROWSER</text>
  <text x="190" y="108" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.25)">BROWSER</text>
  <text x="315" y="108" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.25)">NETWORK</text>
  <text x="445" y="108" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.25)">GOOGLE AI</text>
  <text x="585" y="108" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.25)">CLOUD RUN</text>
  <text x="725" y="108" text-anchor="middle" class="lbl" fill="rgba(255,255,255,.25)">USER</text>
</svg>
