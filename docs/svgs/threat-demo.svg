<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#020408"/>
  <!-- Border -->
  <rect x="2" y="2" width="296" height="296" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <!-- Corner accents -->
  <polyline points="2,20 2,2 20,2" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <polyline points="280,2 298,2 298,20" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <polyline points="2,280 2,298 20,298" fill="none" stroke="#ff2d55" stroke-width="2"/>
  <polyline points="280,298 298,298 298,280" fill="none" stroke="#ff2d55" stroke-width="2"/>

  <text x="150" y="28" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#00d4ff" letter-spacing="2">THREAT SCORE</text>

  <!-- Outer arc track -->
  <circle cx="150" cy="150" r="90" fill="none" stroke="#0a1520" stroke-width="12"/>
  <!-- Animated threat arc - goes from safe to critical -->
  <circle cx="150" cy="150" r="90" fill="none" stroke="url(#threatGrad)" stroke-width="12"
    stroke-dasharray="283 283" stroke-dashoffset="283" stroke-linecap="round"
    transform="rotate(-180 150 150)">
    <animate attributeName="stroke-dashoffset" values="283;56;283" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
  <defs>
    <linearGradient id="threatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30d158"/>
      <stop offset="50%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
  </defs>

  <!-- Score number -->
  <text x="150" y="163" text-anchor="middle" font-family="'Courier New',monospace" font-size="42" font-weight="bold" fill="#ff2d55">
    <animate attributeName="fill" values="#30d158;#ff9500;#ff2d55;#ff9500;#30d158" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="textLength" from="50" to="70" dur="0.1s" repeatCount="indefinite" fill="freeze"/>
    95
  </text>
  <text x="150" y="185" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#ff2d55" letter-spacing="3">
    <animate attributeName="fill" values="#30d158;#ff9500;#ff2d55;#ff9500;#30d158" dur="4s" repeatCount="indefinite"/>
    CRITICAL
  </text>

  <!-- Tick marks -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1">
    <line x1="150" y1="55" x2="150" y2="65" transform="rotate(0 150 150)"/>
    <line x1="150" y1="55" x2="150" y2="65" transform="rotate(45 150 150)"/>
    <line x1="150" y1="55" x2="150" y2="65" transform="rotate(90 150 150)"/>
    <line x1="150" y1="55" x2="150" y2="65" transform="rotate(135 150 150)"/>
    <line x1="150" y1="55" x2="150" y2="65" transform="rotate(180 150 150)"/>
  </g>

  <!-- Labels -->
  <text x="58" y="160" font-family="'Courier New',monospace" font-size="8" fill="#30d158">SAFE</text>
  <text x="220" y="160" font-family="'Courier New',monospace" font-size="8" fill="#ff2d55">CRIT</text>

  <!-- Bottom bars -->
  <text x="30" y="230" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.5)">VOICE</text>
  <rect x="80" y="222" width="170" height="6" rx="1" fill="#0a1520"/>
  <rect x="80" y="222" width="170" height="6" rx="1" fill="#ff9500">
    <animate attributeName="width" values="0;150;170;120;170" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="258" y="230" font-family="'Courier New',monospace" font-size="8" fill="#ff9500">87%</text>

  <text x="30" y="250" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.5)">TEXT</text>
  <rect x="80" y="242" width="170" height="6" rx="1" fill="#0a1520"/>
  <rect x="80" y="242" width="110" height="6" rx="1" fill="#7b61ff">
    <animate attributeName="width" values="0;80;110;90;110" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="258" y="250" font-family="'Courier New',monospace" font-size="8" fill="#7b61ff">64%</text>

  <text x="30" y="270" font-family="'Courier New',monospace" font-size="8" fill="rgba(255,255,255,0.5)">PSYCH</text>
  <rect x="80" y="262" width="170" height="6" rx="1" fill="#0a1520"/>
  <rect x="80" y="262" width="155" height="6" rx="1" fill="#ff2d55">
    <animate attributeName="width" values="0;100;155;130;155" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="258" y="270" font-family="'Courier New',monospace" font-size="8" fill="#ff2d55">91%</text>

  <text x="150" y="292" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="rgba(0,212,255,0.4)">VOXGUARD · GEMINI LIVE 2026</text>
</svg>
