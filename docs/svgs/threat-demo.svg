<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320">
  <defs>
    <style>
      @keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 6px #ff2d55)}50%{filter:drop-shadow(0 0 18px #ff2d55)}}
      @keyframes scorePulse{0%,100%{opacity:.85}50%{opacity:1}}
      @keyframes scanLine{0%{transform:translateY(0)}100%{transform:translateY(300px)}}
      .bg{fill:#020408}.m{font-family:'Courier New',monospace}
    </style>
  </defs>
  <rect width="280" height="320" class="bg" rx="4"/>
  <rect x="1" y="1" width="278" height="318" rx="4" fill="none" stroke="#00ffff" stroke-width="1" opacity=".2"/>

  <!-- Scan line animation -->
  <rect x="0" y="0" width="280" height="2" fill="#00ffff" opacity=".06">
    <animate attributeName="y" from="-2" to="320" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="140" y="28" text-anchor="middle" class="m" font-size="11" fill="#00ffff" letter-spacing="3" font-weight="bold">THREAT SCORE</text>
  <line x1="40" y1="40" x2="240" y2="40" stroke="#00ffff" stroke-width=".5" opacity=".3"/>

  <g transform="translate(140,135)">
    <!-- Arc segments with glow -->
    <path d="M-70,0 A70,70 0 0,1 -49,-49" stroke="#30d158" stroke-width="9" fill="none" stroke-linecap="square" opacity=".95"/>
    <path d="M-49,-49 A70,70 0 0,1 0,-70" stroke="#4ade80" stroke-width="9" fill="none" stroke-linecap="square"/>
    <path d="M0,-70 A70,70 0 0,1 49,-49" stroke="#ffbb33" stroke-width="9" fill="none" stroke-linecap="square"/>
    <path d="M49,-49 A70,70 0 0,1 67,-10" stroke="#ff4d6a" stroke-width="9" fill="none" stroke-linecap="square" style="animation:pulseGlow 2s ease infinite"/>

    <!-- Score -->
    <text x="0" y="-5" text-anchor="middle" class="m" font-size="40" fill="#fff" font-weight="bold" style="animation:scorePulse 2s ease infinite">95</text>
    <text x="0" y="14" text-anchor="middle" class="m" font-size="11" fill="#ff4d6a" letter-spacing="5">CRITICAL</text>

    <text x="-80" y="5" text-anchor="middle" class="m" font-size="8" fill="#4ade80" opacity=".7">SAFE</text>
    <text x="80" y="5" text-anchor="middle" class="m" font-size="8" fill="#ff4d6a" opacity=".7">CRIT</text>
  </g>

  <!-- Sub-scores with bright colors -->
  <g transform="translate(25,190)">
    <text x="0" y="12" class="m" font-size="10" fill="rgba(255,255,255,.6)" letter-spacing="1">VOICE</text>
    <g transform="translate(70,3)">
      <rect width="150" height="10" rx="1" fill="#ff4d6a18"/>
      <rect width="0" height="10" rx="1" fill="#ff4d6a"><animate attributeName="width" from="0" to="130" dur="1.2s" fill="freeze"/></rect>
    </g>
    <text x="228" y="13" class="m" font-size="10" fill="#ff4d6a" font-weight="bold">87%</text>

    <text x="0" y="38" class="m" font-size="10" fill="rgba(255,255,255,.6)" letter-spacing="1">TEXT</text>
    <g transform="translate(70,29)">
      <rect width="150" height="10" rx="1" fill="#5da9ff18"/>
      <rect width="0" height="10" rx="1" fill="#5da9ff"><animate attributeName="width" from="0" to="96" dur="1.2s" begin=".3s" fill="freeze"/></rect>
    </g>
    <text x="228" y="39" class="m" font-size="10" fill="#5da9ff" font-weight="bold">64%</text>

    <text x="0" y="64" class="m" font-size="10" fill="rgba(255,255,255,.6)" letter-spacing="1">PSYCH</text>
    <g transform="translate(70,55)">
      <rect width="150" height="10" rx="1" fill="#ffbb3318"/>
      <rect width="0" height="10" rx="1" fill="#ffbb33"><animate attributeName="width" from="0" to="136" dur="1.2s" begin=".6s" fill="freeze"/></rect>
    </g>
    <text x="228" y="65" class="m" font-size="10" fill="#ffbb33" font-weight="bold">91%</text>
  </g>

  <line x1="30" y1="282" x2="250" y2="282" stroke="#00ffff" stroke-width=".5" opacity=".15"/>
  <text x="140" y="300" text-anchor="middle" class="m" font-size="8" fill="rgba(255,255,255,.35)" letter-spacing="2">VOXGUARD - GEMINI LIVE 2026</text>
</svg>
