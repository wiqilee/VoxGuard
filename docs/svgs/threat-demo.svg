<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300">
  <defs><style>@keyframes glow1{0%,100%{filter:drop-shadow(0 0 4px #ff2d55)}50%{filter:drop-shadow(0 0 12px #ff2d55)}}.bg{fill:#020408}.m{font-family:'Courier New',monospace}</style></defs>
  <rect width="280" height="300" class="bg" rx="4"/><rect x="1" y="1" width="278" height="298" rx="4" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".15"/>
  <text x="140" y="28" text-anchor="middle" class="m" font-size="10" fill="#00d4ff" letter-spacing="3" font-weight="bold">THREAT SCORE</text>
  <line x1="40" y1="38" x2="240" y2="38" stroke="#00d4ff" stroke-width=".5" opacity=".2"/>
  <g transform="translate(140,130)">
    <path d="M-70,0 A70,70 0 0,1 -49,-49" stroke="#30d158" stroke-width="8" fill="none" stroke-linecap="square" opacity=".9"/>
    <path d="M-49,-49 A70,70 0 0,1 0,-70" stroke="#30d158" stroke-width="8" fill="none" stroke-linecap="square"/>
    <path d="M0,-70 A70,70 0 0,1 49,-49" stroke="#ff9500" stroke-width="8" fill="none" stroke-linecap="square"/>
    <path d="M49,-49 A70,70 0 0,1 67,-10" stroke="#ff2d55" stroke-width="8" fill="none" stroke-linecap="square" style="animation:glow1 2s ease infinite"/>
    <text x="0" y="-8" text-anchor="middle" class="m" font-size="36" fill="#ff2d55" font-weight="bold">95</text>
    <text x="0" y="10" text-anchor="middle" class="m" font-size="10" fill="#ff2d55" letter-spacing="4" opacity=".8">CRITICAL</text>
    <text x="-78" y="5" text-anchor="middle" class="m" font-size="7" fill="#30d158" opacity=".5">SAFE</text>
    <text x="78" y="5" text-anchor="middle" class="m" font-size="7" fill="#ff2d55" opacity=".5">CRIT</text>
  </g>
  <g transform="translate(30,175)">
    <text x="0" y="12" class="m" font-size="9" fill="rgba(255,255,255,.4)" letter-spacing="1">VOICE</text>
    <g transform="translate(70,3)"><rect width="140" height="9" rx="1" fill="#ff2d5515"/><rect width="122" height="9" rx="1" fill="#ff2d55" opacity=".8"><animate attributeName="width" from="0" to="122" dur="1s" fill="freeze"/></rect></g>
    <text x="220" y="12" class="m" font-size="9" fill="#ff2d55" font-weight="bold">87%</text>
    <text x="0" y="36" class="m" font-size="9" fill="rgba(255,255,255,.4)" letter-spacing="1">TEXT</text>
    <g transform="translate(70,27)"><rect width="140" height="9" rx="1" fill="#4285F415"/><rect width="90" height="9" rx="1" fill="#4285F4" opacity=".8"><animate attributeName="width" from="0" to="90" dur="1s" begin=".2s" fill="freeze"/></rect></g>
    <text x="220" y="36" class="m" font-size="9" fill="#4285F4" font-weight="bold">64%</text>
    <text x="0" y="60" class="m" font-size="9" fill="rgba(255,255,255,.4)" letter-spacing="1">PSYCH</text>
    <g transform="translate(70,51)"><rect width="140" height="9" rx="1" fill="#ff950015"/><rect width="128" height="9" rx="1" fill="#ff9500" opacity=".8"><animate attributeName="width" from="0" to="128" dur="1s" begin=".4s" fill="freeze"/></rect></g>
    <text x="220" y="60" class="m" font-size="9" fill="#ff9500" font-weight="bold">91%</text>
  </g>
  <line x1="30" y1="265" x2="250" y2="265" stroke="#00d4ff" stroke-width=".5" opacity=".1"/>
  <text x="140" y="282" text-anchor="middle" class="m" font-size="7" fill="rgba(255,255,255,.2)" letter-spacing="2">VOXGUARD · GEMINI LIVE 2026</text>
</svg>
