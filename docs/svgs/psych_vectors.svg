<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" font-family="'Courier New', monospace">
  <defs>
    <style>
      @keyframes bar1 { from { width: 0; } to { width: 289; } }
      @keyframes bar2 { from { width: 0; } to { width: 272; } }
      @keyframes bar3 { from { width: 0; } to { width: 306; } }
      @keyframes bar4 { from { width: 0; } to { width: 136; } }
      @keyframes bar5 { from { width: 0; } to { width: 238; } }
      @keyframes bar6 { from { width: 0; } to { width: 102; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="420" height="360" rx="12" fill="#1a1a2e"/>
  <rect x="1" y="1" width="418" height="358" rx="11" fill="none" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Status dot -->
  <circle cx="20" cy="22" r="5" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="210" y="26" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold" letter-spacing="3">PSYCH VECTORS</text>

  <!-- SCARCITY -->
  <text x="16" y="62" fill="#ff6b6b" font-size="11" font-weight="bold">SCARCITY</text>
  <rect x="16" y="70" width="340" height="20" rx="4" fill="#2a2a4a"/>
  <rect x="16" y="70" rx="4" height="20" fill="#ff6b6b" style="animation: bar1 1.2s ease-out forwards">
    <animate attributeName="width" from="0" to="289" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="316" y="84" fill="#ff6b6b" font-size="12" font-weight="bold" style="animation: fadeIn 0.5s 1.2s both">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    85%
  </text>

  <!-- AUTHORITY -->
  <text x="16" y="112" fill="#ffa726" font-size="11" font-weight="bold">AUTHORITY</text>
  <rect x="16" y="120" width="340" height="20" rx="4" fill="#2a2a4a"/>
  <rect x="16" y="120" rx="4" height="20" fill="#ffa726">
    <animate attributeName="width" from="0" to="272" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="298" y="134" fill="#ffa726" font-size="12" font-weight="bold">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
    80%
  </text>

  <!-- FEAR -->
  <text x="16" y="162" fill="#ef5350" font-size="11" font-weight="bold">FEAR</text>
  <rect x="16" y="170" width="340" height="20" rx="4" fill="#2a2a4a"/>
  <rect x="16" y="170" rx="4" height="20" fill="#ef5350">
    <animate attributeName="width" from="0" to="306" dur="1.2s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="332" y="184" fill="#ef5350" font-size="12" font-weight="bold">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
    90%
  </text>

  <!-- RECIPROCITY -->
  <text x="16" y="212" fill="#ffee58" font-size="11" font-weight="bold">RECIPROCITY</text>
  <rect x="16" y="220" width="340" height="20" rx="4" fill="#2a2a4a"/>
  <rect x="16" y="220" rx="4" height="20" fill="#ffee58">
    <animate attributeName="width" from="0" to="136" dur="1.2s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="162" y="234" fill="#ffee58" font-size="12" font-weight="bold">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    40%
  </text>

  <!-- ISOLATION -->
  <text x="16" y="262" fill="#ce93d8" font-size="11" font-weight="bold">ISOLATION</text>
  <rect x="16" y="270" width="340" height="20" rx="4" fill="#2a2a4a"/>
  <rect x="16" y="270" rx="4" height="20" fill="#ce93d8">
    <animate attributeName="width" from="0" to="238" dur="1.2s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="264" y="284" fill="#ce93d8" font-size="12" font-weight="bold">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
    70%
  </text>

  <!-- COMMITMENT -->
  <text x="16" y="312" fill="#66bb6a" font-size="11" font-weight="bold">COMMITMENT</text>
  <rect x="16" y="320" width="340" height="20" rx="4" fill="#2a2a4a"/>
  <rect x="16" y="320" rx="4" height="20" fill="#66bb6a">
    <animate attributeName="width" from="0" to="102" dur="1.2s" begin="1s" fill="freeze"/>
  </rect>
  <text x="128" y="334" fill="#66bb6a" font-size="12" font-weight="bold">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    30%
  </text>
</svg>
