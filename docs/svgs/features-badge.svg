<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100">
  <defs>
    <style>
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
      .bg{fill:#020408}.lbl{font-family:'Courier New',monospace;font-size:8px;letter-spacing:1.5px;font-weight:bold}.val{font-family:'Courier New',monospace;font-size:7px;letter-spacing:1px}
    </style>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/><stop offset="50%" stop-color="#00d4ff" stop-opacity="1"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="100" class="bg"/>
  <rect x=".5" y=".5" width="799" height="99" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".2"/>
  <rect y="0" width="20" height="100" fill="url(#sg)" opacity=".08"><animate attributeName="x" from="-20" to="800" dur="4s" repeatCount="indefinite"/></rect>
  <text x="400" y="20" text-anchor="middle" class="lbl" fill="#00d4ff" style="font-size:10px;letter-spacing:3px">VOXGUARD CAPABILITIES</text>
  <g transform="translate(20,34)"><rect width="145" height="55" rx="2" fill="#ff2d5510" stroke="#ff2d55" stroke-width="1"/><circle cx="12" cy="14" r="3" fill="#ff2d55" style="animation:blink 1.5s step-end infinite"/><text x="20" y="17" class="lbl" fill="#ff2d55">LIVE AUDIO</text><text x="10" y="33" class="val" fill="rgba(255,255,255,.5)">Gemini Live API</text><text x="10" y="45" class="val" fill="rgba(255,255,255,.35)">Real-time stream</text></g>
  <g transform="translate(180,34)"><rect width="145" height="55" rx="2" fill="#ff950010" stroke="#ff9500" stroke-width="1"/><circle cx="12" cy="14" r="3" fill="#ff9500" style="animation:blink 1.5s step-end .3s infinite"/><text x="20" y="17" class="lbl" fill="#ff9500">RUST WASM</text><text x="10" y="33" class="val" fill="rgba(255,255,255,.5)">Zero-copy audio</text><text x="10" y="45" class="val" fill="rgba(255,255,255,.35)">&lt;80ms latency</text></g>
  <g transform="translate(340,34)"><rect width="145" height="55" rx="2" fill="#7b61ff10" stroke="#7b61ff" stroke-width="1"/><circle cx="12" cy="14" r="3" fill="#7b61ff" style="animation:blink 1.5s step-end .6s infinite"/><text x="20" y="17" class="lbl" fill="#7b61ff">PSYCH SCORING</text><text x="10" y="33" class="val" fill="rgba(255,255,255,.5)">6 Cialdini vectors</text><text x="10" y="45" class="val" fill="rgba(255,255,255,.35)">World first</text></g>
  <g transform="translate(500,34)"><rect width="145" height="55" rx="2" fill="#30d15810" stroke="#30d158" stroke-width="1"/><circle cx="12" cy="14" r="3" fill="#30d158" style="animation:blink 1.5s step-end .9s infinite"/><text x="20" y="17" class="lbl" fill="#30d158">50+ PATTERNS</text><text x="10" y="33" class="val" fill="rgba(255,255,255,.5)">FTC/FBI grounded</text><text x="10" y="45" class="val" fill="rgba(255,255,255,.35)">Zero hallucination</text></g>
  <g transform="translate(660,34)"><rect width="120" height="55" rx="2" fill="#00d4ff10" stroke="#00d4ff" stroke-width="1"/><circle cx="12" cy="14" r="3" fill="#00d4ff" style="animation:blink 1.5s step-end 1.2s infinite"/><text x="20" y="17" class="lbl" fill="#00d4ff">VISION</text><text x="10" y="33" class="val" fill="rgba(255,255,255,.5)">Screen analysis</text><text x="10" y="45" class="val" fill="rgba(255,255,255,.35)">Phishing detect</text></g>
</svg>
